<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dapple Social Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
  /* GitHub's social preview: 1280 x 640. Rendered to .github/social-preview.jpg. */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    position: relative;
    font-family: "SF Pro Display", "Inter", "Segoe UI Variable Display", system-ui, sans-serif;
    font-optical-sizing: auto;
    -webkit-font-smoothing: antialiased;
    color: #f5f5f7;
    text-align: center;
    background: url("../assets/Blue_Dark.png") center / cover no-repeat #0d1420;
  }
  /* Darkens the wallpaper behind the headline, then lets it return around the window. */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(7, 11, 20, 0.78), rgba(7, 11, 20, 0.5) 30%, rgba(7, 11, 20, 0.12) 62%);
  }
  header { position: absolute; top: 30px; left: 0; right: 0; }
  h1 { font-size: 66px; line-height: 1; font-weight: 700; letter-spacing: -0.022em; }
  .question { margin-top: 10px; font-size: 29px; line-height: 1.15; font-weight: 600; letter-spacing: -0.018em; }
  .slogan { margin-top: 10px; font-size: 16.5px; line-height: 1.3; font-weight: 400; letter-spacing: 0; color: rgba(235, 240, 250, 0.84); }
  .window {
    position: absolute;
    top: 192px;
    left: 86px;
    width: 1108px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.28), 0 1px 0 rgba(255, 255, 255, 0.2) inset, 0 28px 70px rgba(0, 0, 0, 0.55);
  }
  .window img { display: block; width: 100%; }
</style>
</head>
<body>
  <header>
    <h1>Dapple</h1>
    <p class="question">What if Apple designed Discord?</p>
    <p class="slogan">Discord, in a new light. Liquid Glass for Equicord, Vencord and BetterDiscord.</p>
  </header>
  <div class="window"><img src="screens/discord.png" alt="Dapple running in Discord"></div>
</body>
</html>
