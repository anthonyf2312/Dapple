<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dapple Social Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
  /* GitHub's social preview: 1280 x 640. Rendered to .github/social-preview.jpg. */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Inter", "Segoe UI Variable Display", system-ui, sans-serif; /* a partial local SF Pro would fake its bold */
    font-optical-sizing: auto;
    -webkit-font-smoothing: antialiased;
    color: #f5f5f7;
    background: #101218;
  }

  /* One window in two appearances. The captures are pixel-aligned, so they meet on one diagonal. */
  .scene { position: absolute; inset: 0; background: center / cover no-repeat; }
  .scene.dark { background-image: url("../assets/Arcella+Alps+Dark+Mac.png"); }
  .scene.light {
    background-image: url("../assets/Arcella+Alps+Light+Mac.png");
    clip-path: polygon(54% 0, 100% 0, 100% 100%, 30% 100%);
  }
  .window {
    position: absolute;
    top: 194px;
    left: 86px;
    width: 1108px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.3), 0 1px 0 rgba(255, 255, 255, 0.22) inset, 0 28px 70px rgba(0, 0, 0, 0.5);
  }
  .window img { display: block; width: 100%; }
  .seam { position: absolute; inset: 0; }

  /* Sits on the dark half only, so the light half stays bright right up to the top edge. */
  .scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(9, 10, 16, 0.74), rgba(9, 10, 16, 0.56) 24%, rgba(9, 10, 16, 0) 36%);
  }
  header { position: absolute; top: 28px; left: 88px; }
  h1 { font-size: 68px; line-height: 1; font-weight: 700; letter-spacing: -0.024em; }
  .question { margin-top: 10px; font-size: 30px; line-height: 1.15; font-weight: 600; letter-spacing: -0.018em; }
  .slogan { margin-top: 9px; font-size: 17px; line-height: 1.3; font-weight: 400; letter-spacing: 0; color: rgba(238, 241, 248, 0.86); }
</style>
</head>
<body>
  <div class="scene dark"><div class="scrim"></div><div class="window"><img src="screens/discord.png" alt="Dapple in dark mode"></div></div>
  <div class="scene light"><div class="window"><img src="screens/discord-light.png" alt="Dapple in light mode"></div></div>
  <svg class="seam" width="1280" height="640" aria-hidden="true"><line x1="691.2" y1="0" x2="384" y2="640" stroke="rgba(255, 255, 255, 0.72)" stroke-width="1.25"/></svg>
  <header>
    <h1>Dapple</h1>
    <p class="question">What if Apple designed Discord?</p>
    <p class="slogan">Discord, in a new light. A Liquid Glass theme.</p>
  </header>
</body>
</html>
